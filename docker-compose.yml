# Study Platform — Docker Compose (DEVELOPMENT_PLAN §3.10.5)
#
# Com Supabase Dev: docker compose up --build
# Com banco local:  docker compose --profile local-db up --build
# Migrações (nunca automáticas):
#   docker compose run --rm backend python manage.py migrate
name: study-platform

services:
  backend:
    build:
      context: ./backend
      target: development
    env_file: ./backend/.env
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
    networks: [app-net]

  frontend:
    build:
      context: ./frontend
      target: development
    env_file: ./frontend/.env.local
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [app-net]

  db:
    profiles: ["local-db"]
    image: postgres:17
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-study_platform}
      POSTGRES_USER: ${LOCAL_DB_USER:-study_platform}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-study_platform}
    # Exposto em localhost para pytest/manage.py executados fora do container
    # (mesma URL padrão de config/settings/test.py e do serviço do CI).
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-study_platform} -d ${LOCAL_DB_NAME:-study_platform}"]
      interval: 5s
      retries: 10
    networks: [app-net]

networks:
  app-net:

volumes:
  pgdata:
  frontend_node_modules:
