# RASCUNHO da Fase 0 (ver DEVELOPMENT_PLAN.md, seção 3.10.5).
# Ainda NÃO funciona: backend/Dockerfile e frontend/Dockerfile serão criados na Fase 0,
# assim como backend/.env e frontend/.env.local (a partir dos arquivos .env.example).
#
# Com Supabase:     docker compose up --build
# Com banco local:  docker compose --profile local-db up --build
name: study-platform

services:
  backend:
    build:
      context: ./backend
      target: development
    env_file: ./backend/.env
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
    networks: [app-net]

  frontend:
    build:
      context: ./frontend
      target: development
    env_file: ./frontend/.env.local
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [app-net]

  db:                                   # opcional, somente com --profile local-db
    profiles: ["local-db"]
    image: postgres:17                  # alinhar à versão do projeto Supabase (verificar no painel; D-13)
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME}
      POSTGRES_USER: ${LOCAL_DB_USER}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER} -d ${LOCAL_DB_NAME}"]
      interval: 5s
      retries: 10
    networks: [app-net]

networks:
  app-net:

volumes:
  pgdata:
  frontend_node_modules:
