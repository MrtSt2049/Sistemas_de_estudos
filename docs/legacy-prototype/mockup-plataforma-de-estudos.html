<style>
/* Layout: barra lateral de navegação + área de trabalho; superfícies de matemática em "papel quadriculado".
   Cor: tinta azul para graduação, vinho para OBMU, verde para Maratona, âmbar para OctoBit. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#EAEEF3; --ink:#15202B; --muted:#586676; --line:#D6DDE5;
  --accent:#1F4E8C; --accent-ink:#FFFFFF; --grad:#1F4E8C; --obmu:#8A2D5B; --cp:#1B7A58; --octobit:#A86B10; --fisico:#5B6877;
  --ok:#1B7A58; --warn:#A86B10; --bad:#B3362D; --grid:rgba(31,78,140,.08); --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 16px rgba(21,32,43,.05);
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --prose:"Newsreader",Georgia,"Times New Roman",serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#161F29; --surface2:#1E2936; --ink:#E5EAF0; --muted:#93A1B1; --line:#2B3846;
  --accent:#6FA8FF; --accent-ink:#0B1118; --grad:#6FA8FF; --obmu:#E58AB8; --cp:#5FD3A4; --octobit:#E8B55B; --fisico:#93A1B1;
  --ok:#5FD3A4; --warn:#E8B55B; --bad:#FF8A80; --grid:rgba(111,168,255,.09); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161F29; --surface2:#1E2936; --ink:#E5EAF0; --muted:#93A1B1; --line:#2B3846;
  --accent:#6FA8FF; --accent-ink:#0B1118; --grad:#6FA8FF; --obmu:#E58AB8; --cp:#5FD3A4; --octobit:#E8B55B; --fisico:#93A1B1;
  --ok:#5FD3A4; --warn:#E8B55B; --bad:#FF8A80; --grid:rgba(111,168,255,.09); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

.nav:hover{background:var(--surface2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--surface2);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav .n{margin-left:auto;font-size:11px;font-family:var(--mono);background:var(--bad);color:#fff;border-radius:9px;padding:0 6px}
.navgrp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
.sidefoot{margin-top:auto;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}

.chip.grad{color:var(--grad);border-color:var(--grad)} .chip.obmu{color:var(--obmu);border-color:var(--obmu)} .chip.cp{color:var(--cp);border-color:var(--cp)} .chip.octobit{color:var(--octobit);border-color:var(--octobit)} .chip.fisico{color:var(--fisico)}
.chip.ok{color:var(--ok);border-color:var(--ok)} .chip.warn{color:var(--warn);border-color:var(--warn)} .chip.bad{color:var(--bad);border-color:var(--bad)} .chip.mut{color:var(--muted)}

.list{display:flex;flex-direction:column}

/* matemática */
.math{font-family:var(--prose);font-size:17px;line-height:1.55;background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;border:1px solid var(--line);border-radius:8px;padding:12px 16px;overflow-wrap:anywhere;min-width:0}

.thm-teorema,.thm-proposicao,.thm-lema,.thm-corolario{border-color:var(--obmu)}.thm-teorema .thm-h,.thm-proposicao .thm-h,.thm-lema .thm-h,.thm-corolario .thm-h{color:var(--obmu)}
.thm-exemplo{border-color:var(--octobit)}.thm-exemplo .thm-h{color:var(--octobit)}
.thm-demonstracao{background:transparent;border-color:var(--line)}.thm-demonstracao .thm-h{color:var(--muted)}
.thm-demonstracao .thm-b::after{content:"∎";display:block;text-align:right;color:var(--muted)}
.rich{display:grid;gap:8px}
.rich .tb{display:flex;gap:4px;flex-wrap:wrap}
.rich .pv{min-height:48px}
.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px;align-items:start}
.src{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;background:var(--surface2);padding:10px;border-radius:6px;overflow-x:auto}
/* modal/toast */
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,16,22,.55);overflow:auto;padding:24px 12px}
#modal.on{display:block}
.dlg{background:var(--bg);border:1px solid var(--line);border-radius:10px;max-width:640px;margin:0 auto;padding:18px 20px;box-shadow:var(--shadow)}
.dlg.wide{max-width:980px}
.dlg>.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}

.tt.bad{background:var(--bad);color:#fff}
.banner{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:13px;background:var(--surface)}
/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal .dh{background:var(--surface2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;color:var(--muted)}
.cal .dc{background:var(--surface);min-height:92px;padding:3px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.cal .dc.out{background:var(--bg);color:var(--muted)}
.cal .dc.today .dn{background:var(--accent);color:var(--accent-ink)}
.cal .dn{font-size:11.5px;font-family:var(--mono);align-self:flex-start;border-radius:9px;padding:0 6px}
.ev{font-size:11.5px;line-height:1.25;padding:1px 5px;border-radius:3px;border-left:3px solid var(--accent);background:var(--surface2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ev.done{text-decoration:line-through;opacity:.6}
.ev.c-prova,.ev.c-entrega{border-color:var(--bad)} .ev.c-estudo{border-color:var(--grad)} .ev.c-revisao{border-color:var(--cp)} .ev.c-simulado{border-color:var(--obmu)} .ev.c-marco{border-color:var(--octobit)} .ev.c-descanso{border-color:var(--muted)}
.wk{background:var(--surface2);border-radius:6px;padding:6px 10px;font-size:13px;margin-bottom:10px}
.svg text{fill:var(--muted);font-size:10px;font-family:var(--ui)}
.svg .gl{stroke:var(--line);stroke-width:1}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);align-items:center;gap:2px}
  .brand,.navgrp,.sidefoot{display:none}
  .nav{width:auto;white-space:nowrap}
  .nav[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .main{padding:16px 16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cal .dc{min-height:60px} .ev{font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ===== Núcleo: utilitários, dados, matemática ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const mondayOf=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const fmtD=s=>s?parseD(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.',''):'—';
const fmtDY=s=>s?parseD(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).replace(/\./g,''):'—';
const toMin=t=>{const [h,m]=String(t||'0:0').split(':').map(Number);return h*60+(m||0)};
const fromMin=n=>p2(Math.floor(n/60))+':'+p2(n%60);
const num=v=>(v===''||v==null||isNaN(Number(v)))?null:Number(v);
const f1=n=>n==null?'—':(Math.round(n*10)/10).toLocaleString('pt-BR');
const f2=n=>n==null?'—':(Math.round(n*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const hrs=min=>f1(min/60)+' h';
const pct=(a,b)=>b>0?Math.round(100*a/b):null;
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);

const TRACKS={grad:'Graduação',obmu:'OBMU',cp:'Maratona'};
const AREAS={grad:'Graduação',obmu:'OBMU',cp:'Maratona',octobit:'OctoBit/MEJ',fisico:'Físico'};
const QSTATES={nao_iniciada:'Não iniciada',andamento:'Em andamento',ajuda:'Resolvida com ajuda',independente:'Resolvida sozinho',dominada:'Dominada',revisao:'Precisa de revisão'};
const QSTCLS={nao_iniciada:'mut',andamento:'warn',ajuda:'warn',independente:'ok',dominada:'ok',revisao:'bad'};
const TSTATES={nao_iniciado:'Não iniciado',estudo:'Em estudo',concluido:'Concluído',revisado:'Revisado'};
const EVTYPES=['Prova','Lista avaliativa','Trabalho','Seminário','Projeto','Outra'];
const ECATS={aula:'Aula',prova:'Prova',entrega:'Entrega',estudo:'Estudo',revisao:'Revisão',simulado:'Simulado/competição',compromisso:'Compromisso',descanso:'Descanso',marco:'Marco'};
const ERRTYPES=['Não entendi o enunciado','Erro de conta','Abordagem errada','Faltou teorema/técnica','Ideia certa, prova incompleta','Gestão de tempo','Bloqueio/ansiedade','Hipótese esquecida','Teorema usado incorretamente','Erro de implementação','Técnica não reconhecida'];
const THEMES=['Teoria dos Números','Combinatória','Álgebra','Análise','Álgebra Linear','Geometria','Probabilidade','Grafos/Algoritmos','Programação dinâmica','Estruturas de dados','Misto','Outro'];

/* ----- dados ----- */
const COLS=['courses','topics','evals','questions','sessions','goals','events','errors','simulados','materials','daily','weekly','config'];
const S={}; COLS.forEach(c=>S[c]={});
const loaded={}; let dbh=null, persist=false, dbError='';
const listOf=c=>Object.entries(S[c]).map(([id,d])=>({...d,id}));
const get=(c,id)=>S[c][id]?{...JSON.parse(JSON.stringify(S[c][id])),id}:null;
const cfg=k=>S.config[k]||{};
function sched(){clearTimeout(sched.t);sched.t=setTimeout(render,40)}
async function put(col,obj){
  const id=obj.id||uid(); const {id:_,...data}=obj;
  S[col][id]=data; sched();
  if(dbh){try{await dbh.collection(col).doc(id).set(JSON.parse(JSON.stringify(data)))}catch(e){toast('Não foi possível salvar: '+(e.message||e.code),'bad')}}
  return id;
}
async function del(col,id){
  delete S[col][id]; sched();
  if(dbh){try{await dbh.collection(col).doc(id).delete()}catch(e){toast('Não foi possível excluir: '+(e.message||e.code),'bad')}}
}
function subscribe(){
  COLS.forEach(c=>{
    try{dbh.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S[c]=o;loaded[c]=true;sched()},e=>{dbError=e.code||'erro';sched()})}
    catch(e){dbError=String(e)}
  });
}

/* ----- feedback ----- */
function toast(msg,kind){const t=document.createElement('div');t.className='tt '+(kind||'');t.textContent=msg;$('#toast').append(t);setTimeout(()=>t.remove(),kind==='bad'?6000:2600)}
let modalOnClose=null;
function openModal(html,{wide=false,onMount,onClose}={}){
  const m=$('#modal'); modalOnClose=onClose||null;
  m.innerHTML=`<div class="dlg ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  m.classList.add('on'); m.scrollTop=0;
  m.onmousedown=e=>{if(e.target===m)closeModal()};
  bindRich(m); typeset(m);
  if(onMount)onMount(m);
}
function closeModal(){const m=$('#modal');m.classList.remove('on');m.innerHTML='';if(modalOnClose){const f=modalOnClose;modalOnClose=null;f()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('on'))closeModal()});
function confirmDlg(msg,onYes,label='Excluir'){
  const prev=$('#modal').innerHTML, prevWide=$('#modal .dlg')?.classList.contains('wide');
  openModal(`<h2>Confirmar</h2><p>${esc(msg)}</p><div class="acts"><button class="btn" data-no>Cancelar</button><button class="btn bad" data-yes>${esc(label)}</button></div>`,{onMount:m=>{
    $('[data-no]',m).onclick=closeModal; $('[data-yes]',m).onclick=()=>{closeModal();onYes()};}});
}

/* ----- matemática (MathJax SVG) ----- */
let mjReady=false, mjQ=Promise.resolve(), mjPending=new Set(), mjFailed=false;
function typeset(el){
  if(!el)return;
  if(!mjReady){mjPending.add(el);return}

const normScore=e=>e.max>0?e.score/e.max*10:0;
const isGraded=e=>e.done&&e.score!=null&&e.score!=='';
function courseCalc(c){
  const ev=listOf('evals').filter(e=>e.courseId===c.id);
  const done=ev.filter(isGraded), pend=ev.filter(e=>!isGraded(e));
  const w=e=>(c.avgRule==='aritmetica')?1:(Number(e.weight)||0);
  const sw=sum(done,w), sx=sum(done,e=>w(e)*normScore(e));
  const avg=sw>0?sx/sw:null; const wP=sum(pend,w), wAll=sw+wP;
  const sims=pend.filter(e=>e.sim!=null&&e.sim!=='');
  let proj=null; if(sims.length){const sw2=sw+sum(sims,w);proj=(sx+sum(sims,e=>w(e)*normScore({score:e.sim,max:e.max})))/sw2}
  let need=null; const goal=num(c.goalAvg);
  if(goal!=null&&wP>0)need=(goal*wAll-sx)/wP;
  return {ev,done,pend,avg,sw,wP,wAll,proj,need,goal};
}
function qAfterAttempt(q,res,date){
  const L=[1,3,7,16,35,80]; q={...q}; q.attempts=[...(q.attempts||[])];
  const prev=q.state;
  if(res==='independente'){q.streak=(q.streak||0)+1;q.indep=[...(q.indep||[]),date];q.next=addDays(date,L[Math.min(q.streak,5)]);q.state='independente';
    const last2=q.indep.slice(-2); if(q.streak>=2&&last2.length===2&&diffDays(last2[0],last2[1])>=3)q.state='dominada'}
  else if(res==='ajuda'){q.streak=0;q.next=addDays(date,2);q.state='ajuda'}
  else{q.streak=0;q.next=addDays(date,1);q.state=(prev==='independente'||prev==='dominada')?'revisao':'andamento'}
  return q;
}

function goalProgress(g){

     ${rq.length?`<div class="list">${rq.slice(0,6).map(r=>`<div class="li">${trackChip(r.track||'grad')}<span class="t">${esc(r.title)}<br><span class="muted sm">${esc(r.sub)} · venceu ${fmtD(r.due)}</span></span></div>`).join('')}</div>`:'<p class="muted">Nada vencido. As revisões aparecem aqui conforme você registra tentativas e erros.</p>'}</div>
   <div class="card"><h2>Minutos por dia (14 dias)</h2>${barChart(days)}<div class="row sm muted" style="margin-top:4px">${Object.keys(AREAS).map(a=>`<span><i style="display:inline-block;width:10px;height:10px;background:var(--${a});border-radius:2px"></i> ${AREAS[a]}</span>`).join('')}</div></div>
   <div class="card"><h2>Registro de hoje</h2><form data-form="daily" class="form">
     ${F('Sono (h)','sono',dl.sono??'',{type:'number',attrs:'step="0.25" min="0" max="16"'})}${F('Energia (0–10)','energia',dl.energia??'',{type:'number',attrs:'min="0" max="10"'})}
     <div class="full row">${CHK('Treino feito','treino',dl.treino)}${CHK('Proteína batida','proteina',dl.proteina)}</div>
     <div class="full row"><button class="btn pri sm">Salvar</button><span class="muted sm">Pontos: <b>${pts}</b>/7 (sono ≥ 7,5 h, treino, proteína, ≥ 50 min de OBMU, caderno de erros)</span></div></form></div>
   <div class="card" style="grid-column:1/-1"><div class="chead"><h2>Disciplinas do semestre</h2><button class="btn sm" data-act="goto" data-k="disciplinas">Ver todas</button></div>
     <div class="grid g3">${listOf('courses').filter(c=>!c.archived&&c.semester===ui.semester).map(c=>courseCard(c,true)).join('')||'<p class="muted">Nenhuma disciplina neste semestre.</p>'}</div></div>
  </div>`;
};
function goalRow(g){
  const v=goalProgress(g), tg=num(g.target)||0; const ok=tg&&v>=tg;
  return `<div style="margin-bottom:10px"><div class="row"><span class="grow" style="overflow-wrap:anywhere">${esc(g.title)}</span><span class="muted sm mono">${f1(v)}/${f1(tg)} ${esc(g.unit||'')}</span></div>${barH(v,tg||1,ok?'ok':'')}</div>`;
}
function evRow(o){
  return `<div class="li"><input type="checkbox" ${o.isDone?'checked':''} data-act="toggleOcc" data-id="${o.id}" data-occ="${o.occ}" aria-label="Concluir"><span class="t" data-act="editEvent" data-id="${o.id}" style="cursor:pointer"><span class="${o.isDone?'muted':''}">${esc(o.title)}</span><br><span class="muted sm">${o.start?o.start+(o.end?'–'+o.end:''):'dia todo'} · ${esc(ECATS[o.cat]||o.cat)}${o.courseId?' · '+esc(cname(o.courseId)):''}</span></span></div>`;
}
ACT.toggleOcc=d=>{const e=get('events',d.id);if(!e)return;
  if(!e.rec||e.rec==='none')e.status=e.status==='feito'?'planejado':'feito';
  else{const a=e.doneDates||[];e.doneDates=a.includes(d.occ)?a.filter(x=>x!==d.occ):[...a,d.occ]}
  put('events',e)};

/* ----- Disciplinas ----- */
function courseCard(c,mini){
  const cc=courseCalc(c), tp=listOf('topics').filter(t=>t.courseId===c.id), tdone=tp.filter(t=>t.status==='concluido'||t.status==='revisado').length;
  const qs=listOf('questions').filter(q=>q.courseId===c.id), mastered=qs.filter(q=>q.state==='independente'||q.state==='dominada').length;
  const riskC={verde:'ok',amarelo:'warn',vermelho:'bad'}[c.risk];
  return `<div class="card click" data-act="openCourse" data-id="${c.id}"><div class="row" style="justify-content:space-between;align-items:flex-start"><div class="grow"><b>${esc(c.name)}</b><div class="muted sm mono">${esc(c.code||'')} · ${c.credits||'—'} cr.</div></div>${c.risk?chip('risco '+c.risk,riskC):''}</div>
  <div class="row" style="margin:8px 0">${c.block?chip(c.block,c.block.includes('OBMU')?'obmu':c.block.includes('Maratona')?'cp':c.block.includes('OctoBit')?'octobit':''):''}</div>
  <div class="row sm"><span>Média parcial: <b>${cc.avg!=null?f2(cc.avg):'—'}</b></span><span class="muted">${cc.pend.length} aval. pendente(s)</span></div>
  ${mini?'':`<div class="sm muted" style="margin-top:8px">Tópicos concluídos ${tdone}/${tp.length}</div>${barH(tdone,tp.length||1)}<div class="sm muted" style="margin-top:6px">Questões dominadas/sozinho ${mastered}/${qs.length}</div>${barH(mastered,qs.length||1,'ok')}`}</div>`;
}
V.disciplinas=()=>{
  if(ui.discId&&S.courses[ui.discId])return courseDetail(get('courses',ui.discId));

  const cs=listOf('courses').filter(c=>(!ui.semester||c.semester===ui.semester)&&(ui.showArch||!c.archived)).sort((a,b)=>a.name.localeCompare(b.name));

   `<select id="semSel" data-f="semester" aria-label="Semestre"><option value="">Todos os semestres</option>${sems.map(s=>`<option ${s===ui.semester?'selected':''}>${esc(s)}</option>`).join('')}</select>${CHK('Arquivadas','',ui.showArch).replace('<input','<input data-f="showArch" data-bool="1"')}<button class="btn pri" data-act="editCourse">Nova disciplina</button>`)+
   (cs.length?`<div class="grid g3">${cs.map(c=>courseCard(c)).join('')}</div>`:emptyBox('Nenhuma disciplina neste filtro.','<button class="btn pri" data-act="editCourse">Cadastrar disciplina</button>'));

ACT.openCourse=d=>{ui.discId=d.id;ui.discTab='visao';sched()};
ACT.backCourses=()=>{ui.discId=null;sched()};
ACT.discTab=d=>{ui.discTab=d.k;sched()};
function courseDetail(c){
  const cc=courseCalc(c), t=ui.discTab;
  const body={visao:()=>courseOverview(c,cc),topicos:()=>courseTopics(c),avaliacoes:()=>courseEvals(c,cc),questoes:()=>`<div class="row" style="margin-bottom:10px"><button class="btn pri" data-act="editQuestion" data-course="${c.id}" data-track="grad">Nova questão</button></div>`+qList(listOf('questions').filter(q=>q.courseId===c.id)),sessoes:()=>courseSessions(c)}[t]();
  return `<div class="head"><div><button class="btn sm ghost" data-act="backCourses">← Disciplinas</button><h1>${esc(c.name)}</h1><p class="mono">${esc(c.code||'')} · ${esc(c.semester||'')} · ${c.credits||'—'} créditos${c.prof?' · Prof. '+esc(c.prof):''}</p></div><div class="row"><button class="btn" data-act="editCourse" data-id="${c.id}">Editar</button><button class="btn" data-act="archiveCourse" data-id="${c.id}">${c.archived?'Reativar':'Arquivar'}</button></div></div>`+
  tabs([['visao','Visão geral'],['topicos','Tópicos'],['avaliacoes','Avaliações e notas'],['questoes','Questões'],['sessoes','Sessões']],t,'discTab')+body;
}
function courseOverview(c,cc){
  const tp=listOf('topics').filter(x=>x.courseId===c.id), qs=listOf('questions').filter(q=>q.courseId===c.id);
  const mins=minutesBy(null,'0000-00-00','9999-99-99',c.id), er=listOf('errors').filter(e=>e.courseId===c.id);
  return `<div class="grid g4" style="margin-bottom:14px">
   <div class="card kpi"><div class="l">Média parcial</div><div class="v">${cc.avg!=null?f2(cc.avg):'—'}</div><div class="s">${cc.done.length} nota(s) lançada(s)</div></div>
   <div class="card kpi"><div class="l">Tempo registrado</div><div class="v">${hrs(mins)}</div></div>
   <div class="card kpi"><div class="l">Tópicos concluídos</div><div class="v">${tp.filter(x=>x.status==='concluido'||x.status==='revisado').length}/${tp.length}</div><div class="s">${tp.filter(x=>x.mastery>=2).length} com domínio demonstrado</div></div>
   <div class="card kpi"><div class="l">Questões</div><div class="v">${qs.length}</div><div class="s">${qs.filter(q=>q.state==='independente'||q.state==='dominada').length} resolvidas sozinho · ${er.length} erro(s) no caderno</div></div></div>
  <div class="grid g2">
   <div class="card"><h2>Informações</h2><table class="tbl"><tr><td class="muted">Bloco</td><td>${esc(c.block||'—')}</td></tr><tr><td class="muted">Frequência mínima</td><td>${c.freq?esc(c.freq)+'%':'<span class="muted">a confirmar com a FFCLRP</span>'}</td></tr><tr><td class="muted">Regra da média</td><td>${c.avgRule==='aritmetica'?'Aritmética':'Ponderada'}</td></tr><tr><td class="muted">Meta de média</td><td>${c.goalAvg!=null&&c.goalAvg!==''?f2(Number(c.goalAvg)):'não definida'}</td></tr></table></div>
   <div class="card"><h2>Sinergia / como estudar</h2>${mathBox(c.synergy||'')}</div>
   <div class="card"><h2>Ementa</h2>${c.eme?mathBox(c.eme):'<p class="muted">Não informada. Cole a ementa em Editar (não foi inventada).</p>'}</div>
   <div class="card"><h2>Bibliografia</h2>${c.bib?mathBox(c.bib):'<p class="muted">Não informada.</p>'}
     ${listOf('materials').filter(m=>m.courseId===c.id).map(m=>`<div class="li"><span class="t">${esc(m.title)}<br><span class="muted sm">${esc(m.author||'')}</span></span></div>`).join('')}</div>
   <div class="card" style="grid-column:1/-1"><h2>Dificuldades e observações</h2>${c.diff?mathBox(c.diff):'<p class="muted">Nenhuma registrada.</p>'}</div></div>`;
}
function courseTopics(c){
  const tp=listOf('topics').filter(x=>x.courseId===c.id).sort((a,b)=>(a.unit||'').localeCompare(b.unit||'')||(a.order||0)-(b.order||0));
  return `<form data-form="topic" data-course="${c.id}" class="card form" style="margin-bottom:14px">${F('Tópico','title','',{req:1})}${F('Unidade/capítulo','unit','')}<div style="align-self:end"><button class="btn pri">Adicionar tópico</button></div></form>
  <p class="muted sm">“Concluído” é administrativo. O domínio só sobe com exercícios, testes ou explicação independente.</p>`+
  (tp.length?`<div class="card scroll"><table class="tbl"><tr><th>Unidade</th><th>Tópico</th><th>Estado</th><th>Domínio demonstrado</th><th></th></tr>${tp.map(x=>`<tr><td>${esc(x.unit||'')}</td><td>${inlineRich(x.title)}</td>
   <td><select data-edit="topics|${x.id}|status|s">${Object.entries(TSTATES).map(([k,l])=>`<option value="${k}" ${x.status===k?'selected':''}>${l}</option>`).join('')}</select></td>
   <td><select data-edit="topics|${x.id}|mastery|n">${['Sem evidência','Parcial','Bom','Demonstrado'].map((l,i)=>`<option value="${i}" ${(x.mastery||0)===i?'selected':''}>${l}</option>`).join('')}</select></td>
   <td><button class="btn sm ghost" data-act="delTopic" data-id="${x.id}" aria-label="Excluir">✕</button></td></tr>`).join('')}</table></div>`:emptyBox('Sem tópicos. Adicione os tópicos da ementa acima.'));
}
ACT.delTopic=d=>confirmDlg('Excluir este tópico?',()=>del('topics',d.id));
function courseEvals(c,cc){
  return `<div class="grid g2" style="margin-bottom:14px">
   <div class="card"><h2>Média</h2>
    <div class="math">$$M=\\frac{\\sum_{i=1}^{n} w_i\\,x_i}{\\sum_{i=1}^{n} w_i}$$ em que $x_i$ é a nota (escala 0–10) e $w_i$ o peso.${c.avgRule==='aritmetica'?' <b>Regra desta disciplina: aritmética</b> ($w_i=1$).':''}</div>
    <table class="tbl" style="margin-top:8px"><tr><td>Média parcial (notas obtidas)</td><td><b>${cc.avg!=null?f2(cc.avg):'—'}</b></td></tr>
    <tr><td>Peso lançado / pendente</td><td>${f1(cc.sw)} / ${f1(cc.wP)}</td></tr>
    <tr><td>Projeção com simulações</td><td>${cc.proj!=null?'<span class="chip warn">simulação</span> '+f2(cc.proj):'—'}</td></tr>
    <tr><td>Meta de média</td><td>${cc.goal!=null?f2(cc.goal):'<span class="muted">defina em Editar</span>'}</td></tr>
    <tr><td>Média necessária nas pendentes</td><td>${cc.need==null?'—':cc.need>10?`<span class="chip bad">inalcançável (${f2(cc.need)})</span>`:cc.need<=0?'<span class="chip ok">meta já garantida</span>':`<b>${f2(cc.need)}</b>`}</td></tr></table>
    <p class="muted sm">Valores simulados nunca entram na média parcial. Recuperação, substituição de nota e arredondamento só entram se você configurar.</p></div>
   <form data-form="eval" data-course="${c.id}" class="card form"><h2 class="full">Nova avaliação</h2>${F('Nome','name','',{req:1})}${F('Tipo','type','Prova',{opts:EVTYPES})}${F('Data','date','',{type:'date'})}${F('Nota máxima','max','10',{type:'number',attrs:'step="any" min="0.01" required'})}${F('Peso','weight','1',{type:'number',attrs:'step="any" min="0" required'})}${F('Nota obtida (vazio se pendente)','score','',{type:'number',attrs:'step="any" min="0"'})}<div class="full"><button class="btn pri">Adicionar</button></div><div class="err full"></div></form></div>`+
  (cc.ev.length?`<div class="card scroll"><table class="tbl"><tr><th>Avaliação</th><th>Data</th><th>Nota</th><th>Máx.</th><th>Peso</th><th>Feita</th><th>Simulação</th><th></th></tr>${cc.ev.sort((a,b)=>(a.date||'z')<(b.date||'z')?-1:1).map(e=>`<tr><td>${esc(e.name)}<br><span class="muted sm">${esc(e.type||'')}</span></td>
   <td><input type="date" value="${esc(e.date||'')}" data-edit="evals|${e.id}|date|s"></td>
   <td><input type="number" step="any" style="width:80px" value="${e.score??''}" data-edit="evals|${e.id}|score|n"></td>
   <td><input type="number" step="any" style="width:70px" value="${e.max}" data-edit="evals|${e.id}|max|n"></td>
   <td><input type="number" step="any" style="width:70px" value="${e.weight}" data-edit="evals|${e.id}|weight|n"></td>
   <td><input type="checkbox" ${e.done?'checked':''} data-edit="evals|${e.id}|done|b" aria-label="Realizada"></td>
   <td>${isGraded(e)?'<span class="muted">—</span>':`<input type="number" step="any" style="width:80px" value="${e.sim??''}" placeholder="hipótese" data-edit="evals|${e.id}|sim|n">`}</td>
   <td><button class="btn sm ghost" data-act="delEval" data-id="${e.id}" aria-label="Excluir">✕</button></td></tr>`).join('')}</table></div>`:emptyBox('Nenhuma avaliação cadastrada. Nada foi inventado: lance provas e notas conforme o calendário da disciplina.'));
}
ACT.delEval=d=>confirmDlg('Excluir esta avaliação?',()=>del('evals',d.id));
function courseSessions(c){
  const ss=listOf('sessions').filter(s=>s.courseId===c.id).sort((a,b)=>a.date<b.date?1:-1);

ACT.editCourse=d=>{
  const c=d.id?get('courses',d.id):{semester:ui.semester||'',avgRule:'ponderada'};
  openModal(`<div class="top"><h2>${d.id?'Editar':'Nova'} disciplina</h2><button class="btn sm ghost" data-no>✕</button></div><form class="form">
   ${F('Nome','name',c.name,{req:1,full:1})}${F('Código','code',c.code)}${F('Semestre (ex.: 2027/1)','semester',c.semester,{req:1})}${F('Professor','prof',c.prof)}${F('Créditos-aula','credits',c.credits,{type:'number',attrs:'min="0"'})}
   ${F('Bloco','block',c.block,{opts:['','Matemática (OBMU)','Aplicada (Maratona)','Negócios','Apoio','OctoBit / MEJ','Outro']})}${F('Frequência mínima (%)','freq',c.freq,{type:'number',attrs:'min="0" max="100"'})}
   ${F('Risco','risk',c.risk||'',{opts:[['','— não avaliado —'],'verde','amarelo','vermelho']})}${F('Regra da média','avgRule',c.avgRule||'ponderada',{opts:[['ponderada','Média ponderada'],['aritmetica','Média aritmética']]})}${F('Meta de média (0–10)','goalAvg',c.goalAvg??'',{type:'number',attrs:'step="any" min="0" max="10"'})}
   ${F('Ementa','eme',c.eme,{type:'textarea',rows:4,full:1})}${F('Bibliografia','bib',c.bib,{type:'textarea',rows:3,full:1})}${F('Sinergia / como estudar (aceita LaTeX)','synergy',c.synergy,{type:'textarea',rows:3,full:1})}${F('Dificuldades e observações (aceita LaTeX)','diff',c.diff,{type:'textarea',rows:3,full:1})}
   <div class="err full"></div></form><div class="acts">${d.id?'<button class="btn bad" data-del>Excluir</button>':''}<button class="btn" data-no>Cancelar</button><button class="btn pri" data-save>Salvar</button></div>`,{onMount:m=>{
    $$('[data-no]',m).forEach(b=>b.onclick=closeModal);
    $('[data-save]',m).onclick=async()=>{const f=$('form',m);if(!f.reportValidity())return;const o=fd(f);o.credits=num(o.credits);o.goalAvg=num(o.goalAvg);
      const id=await put('courses',{...c,...o,id:d.id||('c'+uid())});ui.semester=o.semester;closeModal();toast('Disciplina salva')};
    const dl=$('[data-del]',m);if(dl)dl.onclick=()=>{closeModal();confirmDlg('Excluir a disciplina apaga o vínculo com avaliações e tópicos. Prefira arquivar para preservar o histórico. Excluir mesmo assim?',async()=>{for(const k of ['topics','evals']){for(const x of listOf(k).filter(x=>x.courseId===d.id))await del(k,x.id)}await del('courses',d.id);ui.discId=null;toast('Disciplina excluída')})};
  }});
};
ACT.archiveCourse=d=>{const c=get('courses',d.id);c.archived=!c.archived;put('courses',c);toast(c.archived?'Disciplina arquivada (histórico preservado)':'Disciplina reativada')};

/* ----- Notas ----- */
V.notas=()=>{
  const cs=listOf('courses').filter(c=>(!ui.semester||c.semester===ui.semester)&&!c.archived).sort((a,b)=>a.name.localeCompare(b.name));
  const rows=cs.map(c=>({c,cc:courseCalc(c)}));
  const withAvg=rows.filter(r=>r.cc.avg!=null&&r.c.credits);
  const cr=withAvg.length?sum(withAvg,r=>r.cc.avg*r.c.credits)/sum(withAvg,r=>r.c.credits):null;
  const sems=[...new Set(listOf('courses').map(c=>c.semester).filter(Boolean))].sort().reverse();
  const pend=listOf('evals').filter(e=>!isGraded(e)&&cs.some(c=>c.id===e.courseId)).sort((a,b)=>(a.date||'z')<(b.date||'z')?-1:1);
  return head('Notas e avaliações','Notas obtidas, médias parciais e metas. Simulações ficam separadas das notas reais.',`<select id="semSel2" data-f="semester" aria-label="Semestre"><option value="">Todos</option>${sems.map(s=>`<option ${s===ui.semester?'selected':''}>${esc(s)}</option>`).join('')}</select>`)+
  `<div class="grid g3" style="margin-bottom:14px"><div class="card kpi"><div class="l">Média das disciplinas com nota (peso = créditos, indicativa)</div><div class="v">${cr!=null?f2(cr):'—'}</div></div>
   <div class="card kpi"><div class="l">Avaliações pendentes</div><div class="v">${pend.length}</div></div><div class="card kpi"><div class="l">Notas lançadas</div><div class="v">${sum(rows,r=>r.cc.done.length)}</div></div></div>
  <div class="card scroll"><table class="tbl"><tr><th>Disciplina</th><th>Média parcial</th><th>Notas</th><th>Peso lançado</th><th>Meta</th><th>Necessária</th><th>Projeção (simulada)</th></tr>
  ${rows.map(({c,cc})=>`<tr><td><a href="#disciplinas" data-act="openCourseTab" data-id="${c.id}">${esc(c.name)}</a></td><td><b>${cc.avg!=null?f2(cc.avg):'—'}</b></td><td>${cc.done.length}/${cc.ev.length}</td><td>${f1(cc.sw)}</td><td>${cc.goal!=null?f2(cc.goal):'—'}</td><td>${cc.need==null?'—':cc.need>10?'<span class="chip bad">inalcançável</span>':cc.need<=0?'<span class="chip ok">garantida</span>':f2(cc.need)}</td><td>${cc.proj!=null?'<span class="chip warn">sim.</span> '+f2(cc.proj):'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Sem disciplinas neste semestre.</td></tr>'}</table></div>
  <h2 style="margin:18px 0 8px">Avaliações pendentes</h2>${pend.length?`<div class="card"><div class="list">${pend.map(e=>`<div class="li"><span class="chip mut mono">${fmtD(e.date)}</span><span class="t">${esc(e.name)} <span class="muted">· ${esc(cname(e.courseId))}</span></span><span class="muted sm">peso ${e.weight}</span></div>`).join('')}</div></div>`:emptyBox('Sem avaliações pendentes cadastradas.')}`;
};
ACT.openCourseTab=d=>{ui.route='disciplinas';ui.discId=d.id;ui.discTab='avaliacoes';sched()};

/* ----- Questões ----- */
function qList(qs){
  if(!qs.length)return emptyBox('Nenhuma questão neste filtro.');
  return `<div class="grid g2">${qs.sort((a,b)=>(b.created||'')<(a.created||'')?-1:1).map(q=>`<div class="card click" data-act="openQuestion" data-id="${q.id}">
   <div class="row" style="margin-bottom:6px">${trackChip(q.track)}${chip(QSTATES[q.state||'nao_iniciada'],QSTCLS[q.state||'nao_iniciada'])}${q.difficulty?`<span class="muted sm" title="Dificuldade">${'●'.repeat(q.difficulty)}${'○'.repeat(5-q.difficulty)}</span>`:''}</div>

ACT.openQuestion=d=>{
  const q=get('questions',d.id); if(!q)return; const t0=Date.now(); ui.hints[q.id]=ui.hints[q.id]||{n:0,off:false}; const cp=q.track==='cp';

    ${F('Ajuda usada','help','nenhuma',{opts:Object.entries(HELP_LABEL)})}${cp?F('Veredito','verdict','AC',{opts:['AC','WA','TLE','RE','MLE','CE','Outro']}):''}

function attemptTable(q){

const DEFAULT_AVAIL=['07:00-08:30,20:30-22:00','07:00-08:30,20:30-22:00','07:00-08:30,20:30-22:00','07:00-08:30,20:30-22:00','07:00-08:30,20:30-22:00','14:00-18:30','09:00-10:30,14:00-15:30,20:30-21:30'];

const avail=()=>({...Object.fromEntries(DEFAULT_AVAIL.map((x,i)=>[i,x])),...(cfg('settings').avail||{})});
function windowsFor(date){const wd=(parseD(date).getDay()+6)%7;return String(avail()[wd]||'').split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const [a,b]=s.split('-');return [toMin(a),toMin(b)]}).filter(([a,b])=>b>a)}
function occupied(date,extra){return [...expandEvents(date,date).filter(o=>o.status!=='cancelado'&&o.start&&o.end&&o.cat!=='marco').map(o=>[toMin(o.start),toMin(o.end)]),...(extra[date]||[])]}
function findSlot(date,dur,extra){const occ=occupied(date,extra);for(const [a,b] of windowsFor(date))for(let s=a;s+dur<=b;s+=15)if(!occ.some(([x,y])=>s<y&&s+dur>x))return s;return null}
function planWeek(monday,wants){
  const extra={}, blocks=[], short={}; const t=today();
  const days=[...Array(7)].map((_,i)=>addDays(monday,i)).filter(d=>d>=t);
  if(!days.length)return {blocks,short:{},note:'A semana já passou.'};
  let ptr=0;
  for(const a of ['obmu','grad','cp','octobit']){
    let need=Math.round((wants[a]||0)*60);
    while(need>=30){const dur=Math.min(90,need);let placed=false;
      for(let k=0;k<days.length&&!placed;k++){const d=days[(ptr+k)%days.length];const s=findSlot(d,dur,extra);
        if(s!=null){(extra[d]=extra[d]||[]).push([s,s+dur]);blocks.push({date:d,start:fromMin(s),end:fromMin(s+dur),area:a});placed=true;ptr=(ptr+k+1)%days.length}}
      if(!placed){short[a]=need;break}
      need-=dur}
  }
  return {blocks,short};
}

const OBM_PHASES=[['Fev–mar/27','#1, #2','≥ 1','Fundamentos e escrita'],['Abr–mai/27','#3, #4','≥ 2','Repertório de técnicas'],['Jun–jul/27','#5 a #8','≥ 2,5 + parciais','Consistência e tempo'],['Set/27','#9, #10','≥ meta de simulado (corte + 15%)','Performance']];
V.olimpica=()=>{
  const sims=listOf('simulados').sort((a,b)=>a.date<b.date?-1:1), corte=num(cfg('obmu').corte), meta=corte!=null?corte*1.15:null;
  const t=ui.olTab;
  let body='';
  if(t==='visao'){
    body=`<div class="grid g2"><div class="card"><h2>Meta de simulado</h2><form data-form="corte" class="row"><label class="f" style="width:220px">Corte médio do ouro 2020–2025 (/300)<input type="number" name="corte" step="any" min="0" max="300" value="${corte??''}"></label><button class="btn pri" style="align-self:end">Salvar</button></form>
     <p class="mono">Meta = corte médio × 1,15 = <b>${meta!=null?f1(meta):'—'}</b></p><p class="muted sm">O corte precisa ser levantado no site da OBM (tarefa da semana 1 do plano). Nenhum valor foi presumido.</p></div>
     <div class="card"><h2>Evolução dos simulados</h2>${sims.length?lineChart(sims.map((s,i)=>({v:s.total,l:'S#'+(i+1)})),{goal:meta}):'<p class="muted">Registre o primeiro simulado (previsto para fev/2027).</p>'}</div>
     <div class="card" style="grid-column:1/-1"><h2>Trajetória prevista</h2><div class="scroll"><table class="tbl"><tr><th>Período</th><th>Simulados</th><th>Problemas completos de 6</th><th>Foco</th></tr>${OBM_PHASES.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div></div>
     <div class="card" style="grid-column:1/-1"><h2>Protocolo de 1 problema difícil</h2><table class="tbl"><tr><td class="mono">0–15 min</td><td>Entender: hipóteses, objetivo, casos pequenos</td></tr><tr><td class="mono">15–45 min</td><td>Ataque livre: invariante, extremo, contar de duas formas, simetria</td></tr><tr><td class="mono">45–90 min</td><td>Tentativa séria da ideia mais promissora</td></tr><tr><td class="mono">90 min</td><td>Travado? Uma dica, nunca a solução inteira</td></tr><tr><td class="mono">120 min</td><td>Ler a solução, fechar, reconstruir sozinho</td></tr><tr><td class="mono">Final</td><td>Escrever a solução formal e registrar a técnica em uma frase</td></tr></table></div></div>`;
  }else if(t==='provas'){
    const it=cfg('provas').items||[];
    body=it.length?`<div class="card scroll"><table class="tbl"><tr><th>Ano</th><th>Formato</th><th>Uso planejado</th><th>Estado</th><th>Nota /300</th><th>Observação</th></tr>${it.map((p,i)=>`<tr><td class="mono">${p.ano}</td><td>${esc(p.formato)}</td><td style="min-width:200px">${esc(p.uso)}</td>
     <td><select data-prova="${i}|status">${['A fazer','Em andamento','Feito'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
     <td><input type="number" style="width:80px" min="0" max="300" value="${p.nota??''}" data-prova="${i}|nota"></td><td style="min-width:220px">${esc(p.obs||'')}</td></tr>`).join('')}</table></div>`:emptyBox('Banco de provas não carregado.');
  }else if(t==='simulados'){
    body=`<div class="row" style="margin-bottom:10px"><button class="btn pri" data-act="editSimulado">Registrar simulado</button></div>`+(sims.length?`<div class="card scroll"><table class="tbl"><tr><th>#</th><th>Data</th><th>Prova</th><th>Q1–Q6</th><th>Total</th><th>Δ meta</th><th>Erro dominante</th><th>Reescrito</th><th></th></tr>${sims.map((s,i)=>`<tr><td>S#${i+1}</td><td>${fmtDY(s.date)}</td><td>${esc(s.prova||'')}</td><td class="mono">${(s.q||[]).join(' · ')}</td><td><b>${s.total}</b></td><td>${meta!=null?f1(s.total-meta):'—'}</td><td>${esc(s.errType||'')}</td><td>${s.rewritten?'✓':''}</td><td><button class="btn sm" data-act="editSimulado" data-id="${s.id}">Editar</button></td></tr>`).join('')}</table></div>`:emptyBox('Nenhum simulado ainda. Protocolo: 14:00–18:30, 3 questões por dia, correção com rubrica 0/10/25/40/50.'));
  }else if(t==='problemas'){
    body=`<div class="row" style="margin-bottom:10px"><button class="btn pri" data-act="editQuestion" data-track="obmu">Novo problema</button></div>`+qFilters('obmu')+qList(filteredQuestions('obmu'));
  }else{
    body=`<div class="row" style="margin-bottom:10px"><button class="btn pri" data-act="editMaterial" data-kind="tecnica" data-area="obmu">Nova técnica</button></div>`+matGrid(listOf('materials').filter(m=>m.kind==='tecnica'));
  }
  return head('Matemática olímpica — OBMU 2027','Banco de provas, simulados, problemas e caderno de técnicas.')+tabs([['visao','Visão'],['provas','Banco de provas'],['simulados','Simulados'],['problemas','Problemas'],['tecnicas','Técnicas']],t,'olTab')+body;
};

ACT.editSimulado=d=>{

   ${F('Tempo por questão','time',s.time||'',{full:1,ph:'ex.: Q1 40 min, Q2 80 min…'})}${F('Erro dominante','errType',s.errType||'',{opts:['',...ERRTYPES]})}<div style="align-self:end">${CHK('Reescrito','rewritten',s.rewritten)}</div>${F('Observações','obs',s.obs||'',{type:'textarea',rows:2,full:1})}</form>

 ['Intermediário (fev–jun/27)',['Árvores: LCA, Euler tour, binary lifting','Fenwick, Segment Tree (lazy), sparse table','Grafos II: MST, SCC, Floyd, Bellman-Ford, ordenação topológica','Strings: KMP, Z-function, hashing, trie','DP: bitmask, digit DP, otimizações simples','Combinatória modular, inverso modular, CRT, Euclides estendido','Geometria básica: produto vetorial, convex hull']],
 ['Pico (jul–set/27)',['Revisão do notebook e dos tópicos fracos','Contests em equipe a cada fim de semana (5 h)','Simulação de pressão: caderno impresso e divisão de papéis']],

V.maratona=()=>{
  const t=today(), wk=mondayOf(t), cp=cfg('cp'), done=cfg('cptrail').done||{};
  const qs=listOf('questions').filter(q=>q.track==='cp');
  const solvedWk=qs.filter(q=>(q.attempts||[]).some(a=>a.res==='independente'&&a.date>=wk)).length, solvedAll=qs.filter(q=>(q.attempts||[]).some(a=>a.res==='independente')).length;
  const cw=currentWeek(); let body='';
  if(ui.cpTab==='problemas')body=`<div class="row" style="margin-bottom:10px"><button class="btn pri" data-act="editQuestion" data-track="cp">Novo problema</button></div>`+qFilters('cp')+qList(filteredQuestions('cp'));
  else body=CP_TRAIL.map(([g,items],gi)=>`<div class="card" style="margin-bottom:12px"><h2>${esc(g)}</h2>${items.map((x,i)=>{const k=gi+'.'+i;return `<label class="chk" style="margin:4px 0"><input type="checkbox" ${done[k]?'checked':''} data-act="trailToggle" data-k="${k}"> ${esc(x)}</label>`}).join('<br>')}</div>`).join('')+`<p class="muted sm">Fonte: plano 02-MARATONA-SBC-2027. Marque conforme estudar e resolver, não só ler.</p>`;
  return head('Maratona SBC 2027','Problemas, submissões registradas manualmente e trilha de conteúdo. Sem juiz integrado: o veredito é o que você anota.')+
  `<div class="grid g4" style="margin-bottom:14px"><div class="card kpi"><div class="l">Resolvidos sozinho na semana</div><div class="v">${solvedWk}/4</div><div class="s">meta do plano: ≥ 4 por semana</div></div>
   <div class="card kpi"><div class="l">Total resolvido sozinho</div><div class="v">${solvedAll}</div></div>
   <div class="card kpi"><div class="l">Horas na semana</div><div class="v">${hrs(minutesBy('cp',wk,addDays(wk,6)))}</div><div class="s">${cw?'plano: '+cw.hM+' h':''}</div></div>
   <div class="card kpi"><div class="l">Rating Codeforces</div><form data-form="rating" class="row"><input type="number" name="r0" style="width:80px" placeholder="base" value="${cp.base??''}" aria-label="Base"><input type="number" name="r1" style="width:80px" placeholder="atual" value="${cp.atual??''}" aria-label="Atual"><button class="btn sm">OK</button></form><div class="s">${cp.base!=null&&cp.atual!=null?'variação '+(cp.atual-cp.base>=0?'+':'')+(cp.atual-cp.base):'informe base e atual'}</div></div></div>`+
  tabs([['problemas','Problemas'],['trilha','Trilha e ferramentas']],ui.cpTab,'cpTab')+body;
};

 correcao:['Correção de solução','Avalie a solução do estudante: aponte o primeiro passo inválido, a justificativa ausente ou a hipótese esquecida. Diga o que está correto.'],

};
let tutorCtl=null;
ACT.tutorClear=()=>{ui.chat=[];sched()};
ACT.tutorStop=()=>{tutorCtl&&tutorCtl.abort()};
ACT.saveChat=async d=>{const m=ui.chat[Number(d.i)];await put('materials',{title:'Tutor: '+(ui.chat[Number(d.i)-1]?.content||'').slice(0,60),kind:'anotacao',area:'grad',courseId:ui.tcourse||'',notes:m.content,status:'gerado por IA'});toast('Salvo na biblioteca')};
ACT.tutorSend=async()=>{
  const ta=$('#tIn'); const txt=ta.value.trim(); if(!txt||!SAMP||ui.chatBusy)return;
  const cfgf=fd($('[data-form=tutorcfg]')); ui.tmode=cfgf.mode;ui.thelp=cfgf.help;ui.tcourse=cfgf.course;ui.tq=cfgf.q;
  const c=ui.tcourse?get('courses',ui.tcourse):null, q=ui.tq?get('questions',ui.tq):null;
  const ctx=[c?`Disciplina: ${c.name}.${c.eme?'\nEmenta (do aluno): '+c.eme:''}${c.bib?'\nBibliografia (do aluno): '+c.bib:''}`:'',q?`Questão anexada: ${q.title}\nEnunciado: ${q.statement}\nSolução atual do aluno: ${(q.sols||[]).slice(-1)[0]?.text||'(nenhuma)'}\nTentativas: ${(q.attempts||[]).length}`:''].filter(Boolean).join('\n\n');
  const RULES=`Você é o tutor de um estudante brasileiro de Matemática Aplicada a Negócios (USP) que também treina para a OBMU e a Maratona SBC. Responda em português.\nModo: ${MODOS[ui.tmode][0]}. ${MODOS[ui.tmode][1]}\nNível de ajuda pedido: ${HELPLV[ui.thelp]}. Respeite-o.\nFormato: use LaTeX com $...$ (em linha) e $$...$$ (destacado); para estruturar use blocos que começam com uma linha ":::teorema Nome", ":::definicao Nome", ":::demonstracao", ":::lema", ":::proposicao", ":::exemplo" e terminam com uma linha ":::". Seja rigoroso com hipóteses e quantificadores.\nHonestidade: diga explicitamente o que vem do material fornecido, o que é explicação complementar sua e o que é incerto. Não invente páginas, citações, gabaritos oficiais nem resultados. Nunca afirme que um código foi executado ou aceito. Exercícios propostos por você devem ser marcados como "gerado por IA".\n${ctx?'\nContexto do aluno:\n'+ctx:''}`;
  ui.chat.push({role:'user',content:txt});ui.chat.push({role:'assistant',content:''});ui.chatBusy=true;sched();
  tutorCtl=new AbortController();
  const turns=[{role:'user',content:RULES},...ui.chat.slice(0,-1).slice(-11)];
  let last=0;
  try{
    const r=await SAMP(turns,{cache:false,signal:tutorCtl.signal,modelTier:ui.tmode==='rigor'||ui.tmode==='correcao'?'complex':'default',onText:({text})=>{ui.chat[ui.chat.length-1].content=text;const now=Date.now();if(now-last>700){last=now;sched()}}});
    ui.chat[ui.chat.length-1].content=r.text+(r.truncated?'\n\n*(resposta cortada; peça para continuar)*':'');
  }catch(e){
    const part=e.text||''; const msg={not_granted:'Você não permitiu o uso do Claude nesta página.',rate_limited:'Limite de uso atingido. Tente mais tarde.',cancelled:'',sampling_disabled:'Claude indisponível nesta conta.'}[e.code];
    ui.chat[ui.chat.length-1].content=part+(msg===''?'\n\n*(interrompido)*':'\n\n*'+(msg||'Falha ao consultar o Claude. Tente novamente.')+'*');
  }
  ui.chatBusy=false;sched();
};

/* ===== Relatórios ===== */
V.relatorios=()=>{
  const w=ui.rep, e=addDays(w,6), prev=addDays(w,-7), cw=(cfg('calendario').weeks||[]).find(x=>x.ini===w);
  const att=allAttempts().filter(a=>a.date>=w&&a.date<=e), indep=att.filter(a=>a.res==='independente').length, help=att.filter(a=>a.res==='ajuda').length;
  const errs=listOf('errors').filter(x=>x.date>=w&&x.date<=e);
  const byCourse={};errs.forEach(x=>{if(x.courseId)byCourse[x.courseId]=(byCourse[x.courseId]||0)+1});
  const goalsHit=listOf('goals').filter(g=>g.end&&g.end>=w&&g.end<=e&&goalProgress(g)>=(num(g.target)||Infinity));
  const planned=cw?{obmu:cw.hO,cp:cw.hM,octobit:cw.hC,fisico:cw.hF}:{};
  const rec=[];
  Object.keys(planned).forEach(a=>{const r=minutesBy(a,w,e)/60;if(planned[a]&&r<planned[a]*.7)rec.push(`${AREAS[a]}: ${f1(r)} h de ${planned[a]} h planejadas. Se faltou tempo, corte escopo na ordem do protocolo (Maratona, depois OctoBit), não sono.`)});
  if(reviewQueue().length)rec.push(`${reviewQueue().length} revisão(ões) vencida(s): faça antes de conteúdo novo.`);
  const topErr=Object.entries(byCourse).sort((a,b)=>b[1]-a[1])[0];if(topErr)rec.push(`Mais erros em ${cname(topErr[0])} (${topErr[1]}): gere exercícios direcionados.`);
  if(att.length>=3&&indep/att.length<.5)rec.push('Menos da metade das tentativas foi sem ajuda: retome problemas já vistos antes de avançar.');
  const wk=get('weekly',w)||{};
  return head('Relatório semanal','Produtividade (tempo) separada de aprendizagem (acerto sem ajuda, retenção).',`<button class="btn" data-act="repNav" data-n="-1">←</button><b>${fmtD(w)} – ${fmtD(e)}</b><button class="btn" data-act="repNav" data-n="1">→</button><button class="btn" data-act="repNav" data-n="0">Atual</button>`)+
  `<div class="grid g2"><div class="card"><h2>Tempo por área (produtividade)</h2><table class="tbl"><tr><th>Área</th><th>Plano</th><th>Registrado</th></tr>${Object.keys(AREAS).map(a=>`<tr><td>${chip(AREAS[a],a)}</td><td>${planned[a]!=null?planned[a]+' h':'—'}</td><td>${hrs(minutesBy(a,w,e))}</td></tr>`).join('')}</table></div>
   <div class="card"><h2>Aprendizagem</h2><table class="tbl"><tr><td>Tentativas em questões</td><td>${att.length}</td></tr><tr><td>Sem ajuda</td><td>${indep}${att.length?' ('+pct(indep,att.length)+'%)':''}</td></tr><tr><td>Com ajuda</td><td>${help}</td></tr><tr><td>Questões distintas resolvidas sozinho</td><td>${new Set(att.filter(a=>a.res==='independente').map(a=>a.qid)).size}</td></tr><tr><td>Erros registrados</td><td>${errs.length}</td></tr><tr><td>Metas com prazo na semana atingidas</td><td>${goalsHit.length}</td></tr></table>
   <p class="muted sm">Horas altas com pouco acerto sem ajuda indicam estudo passivo; o contrário, boa retenção com pouco tempo.</p></div>
   <div class="card"><h2>Recomendações para a próxima semana</h2>${rec.length?`<ul>${rec.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:'<p class="muted">Sem alertas com os dados desta semana.</p>'}</div>
   <form class="card form" data-form="weekly" data-week="${w}"><h2 class="full">Revisão de domingo</h2>${F('Maior erro da semana','hardest',wk.hardest||'',{full:1})}${F('Ajuste para a próxima semana','adjust',wk.adjust||'',{type:'textarea',rows:3,full:1})}<div class="full"><button class="btn pri">Salvar revisão</button></div></form></div>`;
};
ACT.repNav=d=>{const n=Number(d.n);ui.rep=n===0?mondayOf(today()):addDays(ui.rep,7*n);sched()};

/* ===== Configurações ===== */
V.config=()=>head('Configurações')+
  `<div class="grid g2"><div class="card"><h2>Dados</h2><p>${persist?'<span class="chip ok">Banco de dados ativo</span> Tudo é salvo automaticamente e permanece depois de fechar a página.':'<span class="chip bad">Sem banco de dados nesta visualização</span> Alterações ficam só na memória desta aba.'}</p>${dbError?`<p class="chip bad">Erro de leitura: ${esc(dbError)}</p>`:''}
   <table class="tbl">${COLS.filter(c=>c!=='config').map(c=>`<tr><td class="muted">${c}</td><td>${Object.keys(S[c]).length}</td></tr>`).join('')}</table>
   <div class="row" style="margin-top:10px"><button class="btn" data-act="exportJson">Exportar backup (JSON)</button><button class="btn" data-act="exportIcs">Exportar calendário (.ics)</button></div></div>
   <div class="card"><h2>Aparência</h2><div class="row"><button class="btn" data-act="theme" data-t="">Automático</button><button class="btn" data-act="theme" data-t="light">Claro</button><button class="btn" data-act="theme" data-t="dark">Escuro</button></div>
   <h2 style="margin-top:16px">Exemplo de matemática</h2>${mathBox(':::teorema Cauchy–Schwarz\nPara $a_i,b_i\\in\\mathbb{R}$,\n$$\\left(\\sum_{i=1}^{n} a_i b_i\\right)^2\\le\\left(\\sum_{i=1}^{n} a_i^2\\right)\\left(\\sum_{i=1}^{n} b_i^2\\right).$$\n:::\n:::demonstracao\nPara $t\\in\\mathbb{R}$, $\\sum (a_i t-b_i)^2\\ge 0$. O discriminante do trinômio em $t$ é então $\\le 0$, o que dá a desigualdade. Em forma matricial, para $A=\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}$ vale $\\det A=-2$.\n:::')}</div></div>`;
ACT.theme=d=>{const r=document.documentElement;if(d.t)r.setAttribute('data-theme',d.t);else r.removeAttribute('data-theme');try{localStorage.setItem('tema',d.t||'')}catch(e){}};

/* ===== Eventos globais e render ===== */
const FORMS={
  daily:async f=>{const o=fd(f);await put('daily',{id:today(),date:today(),sono:num(o.sono),energia:num(o.energia),treino:o.treino,proteina:o.proteina});toast('Registro salvo')},
  topic:async f=>{const o=fd(f);await put('topics',{courseId:f.dataset.course,title:o.title,unit:o.unit,status:'nao_iniciado',mastery:0,order:Date.now()});toast('Tópico adicionado')},
  eval:async f=>{const o=fd(f);const mx=num(o.max),w=num(o.weight),sc=num(o.score);const err=$('.err',f);
    if(!(mx>0)){err.textContent='A nota máxima deve ser maior que zero.';return}if(w==null||w<0){err.textContent='O peso não pode ser negativo.';return}if(sc!=null&&(sc<0||sc>mx)){err.textContent='A nota obtida deve estar entre 0 e a nota máxima.';return}
    await put('evals',{courseId:f.dataset.course,name:o.name,type:o.type,date:o.date,max:mx,weight:w,score:sc,done:sc!=null});toast('Avaliação adicionada')},
  timer:f=>{const o=fd(f);ui.timer={start:Date.now(),area:o.area,courseId:o.courseId,content:o.content};sched()},
  avail:async f=>{const o=fd(f);const av={};WD.forEach((_,i)=>av[i]=o['d'+i]);const bad=Object.values(av).some(v=>v&&!/^(\d{1,2}:\d{2}-\d{1,2}:\d{2})(\s*,\s*\d{1,2}:\d{2}-\d{1,2}:\d{2})*$/.test(v.trim()));
    if(bad){toast('Formato inválido. Use HH:MM-HH:MM separado por vírgula.','bad');return}await put('config',{...cfg('settings'),avail:av,maxPerDay:Number(o.maxPerDay)||2,id:'settings'});toast('Disponibilidade salva')},
  corte:async f=>{const o=fd(f);await put('config',{corte:num(o.corte),id:'obmu'});toast('Meta atualizada')},
  rating:async f=>{const o=fd(f);await put('config',{base:num(o.r0),atual:num(o.r1),id:'cp'});toast('Rating salvo')},
  weekly:async f=>{await put('weekly',{...fd(f),id:f.dataset.week});toast('Revisão salva')},
  tutorcfg:()=>{}
};
document.addEventListener('submit',e=>{e.preventDefault();const k=e.target.dataset&&e.target.dataset.form;if(k&&FORMS[k])FORMS[k](e.target)});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;if(t.tagName==='A')e.preventDefault();const fn=ACT[t.dataset.act];if(fn)fn(t.dataset,e)});
function setPath(o,p,v){const k=p.split('.');let c=o;while(k.length>1)c=c[k.shift()];c[k[0]]=v}
const onField=e=>{const t=e.target;
  if(t.dataset.f){setPath(ui,t.dataset.f,t.dataset.bool?t.checked:t.value);sched()}
  else if(t.dataset.edit&&e.type==='change'){const [col,id,field,kind]=t.dataset.edit.split('|');const o=get(col,id);if(!o)return;let v=t.value;if(kind==='n')v=num(v);if(kind==='b')v=t.checked;o[field]=v;
    if(col==='evals'&&field==='score'&&v!=null)o.done=true;put(col,o)}
  else if(t.dataset.prova&&e.type==='change'){const [i,field]=t.dataset.prova.split('|');const c=cfg('provas');const items=c.items.map((p,j)=>j===Number(i)?{...p,[field]:field==='nota'?num(t.value):t.value}:p);put('config',{items,id:'provas'})}
};
document.addEventListener('change',onField);
document.addEventListener('input',e=>{if(e.target.dataset.f&&['search','text'].includes(e.target.type))onField(e)});
ACT.goto=d=>{ui.route=d.k;if(d.tab)ui.planTab=d.tab;if(d.disc){ui.discId=d.disc;ui.discTab='visao'}else if(d.k==='disciplinas')ui.discId=null;try{history.replaceState(null,'','#'+d.k)}catch(e){try{location.hash=d.k}catch(_){}}sched();window.scrollTo(0,0)};
const NAV=[['dashboard','Painel',''],['g','Graduação'],['disciplinas','Disciplinas'],['notas','Notas'],['questoes','Questões'],['g','Aprendizagem'],['revisao','Revisão'],['erros','Caderno de erros'],['estudo','Estudo'],['tutor','Tutor de IA'],['g','Competições'],['olimpica','OBMU'],['maratona','Maratona SBC'],['g','Organização'],['planejamento','Planejamento'],['biblioteca','Biblioteca'],['relatorios','Relatórios'],['config','Configurações']];
function render(){
  const main=$('#main'), nav=$('#nav'); if(!main)return;
  const ae=document.activeElement, fid=ae&&ae.id&&main.contains(ae)?ae.id:null, sel=fid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  const rq=reviewQueue().length;
  nav.innerHTML=`<div class="brand"><b>Plataforma de Estudos</b><span>Marcus · USP-FFCLRP</span></div>`+NAV.map(([k,l])=>k==='g'?`<div class="navgrp">${l}</div>`:`<button class="nav" data-act="goto" data-k="${k}" ${ui.route===k?'aria-current="page"':''}>${l}${k==='revisao'&&rq?`<span class="n">${rq}</span>`:''}</button>`).join('')+`<div class="sidefoot">${persist?'<span>● dados salvos automaticamente</span>':'<span>○ sem banco de dados (memória da aba)</span>'}</div>`;
  if(window.MathJax&&mjReady&&MathJax.typesetClear)try{MathJax.typesetClear([main])}catch(e){}
  let html='';
  try{html=(V[ui.route]||V.dashboard)()}catch(err){console.error(err);html=`<div class="banner">Erro ao montar esta tela: ${esc(err.message)}</div>`}
  main.innerHTML=(dbChecked&&!persist?'<div class="banner">Banco de dados indisponível nesta visualização: o que você digitar não será salvo depois de fechar a aba.</div>':'')+html;
  typeset(main);
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}
let dbChecked=false, SAMP=undefined, DL=null;
(async function init(){
  try{const h=location.hash.replace('#','');if(h&&V[h])ui.route=h}catch(e){}
  try{const th=localStorage.getItem('tema');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
  window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']],processEscapes:true,packages:{'[+]':['ams']}},svg:{fontCache:'global'},startup:{typeset:false}};
  const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js';sc.async=true;
  sc.onload=()=>MathJax.startup.promise.then(()=>{flushMath();sched()});sc.onerror=()=>{mjFailed=true;toast('Não foi possível carregar o renderizador de LaTeX','bad')};
  document.head.append(sc);
  render();
  const cl=window.claude;
  if(cl&&cl.use){
    try{dbh=await cl.use('db')}catch(e){dbh=null}
    try{SAMP=await cl.use('sample')}catch(e){SAMP=null}
    try{DL=await cl.use('downloads')}catch(e){DL=null}
  }else{SAMP=null}
  persist=!!dbh;dbChecked=true;if(dbh)subscribe();
  render();
})();

</script>

</body></html>
