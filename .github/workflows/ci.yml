name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Lint, Types, Tests, OpenAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: study_platform_test
          POSTGRES_USER: study_platform
          POSTGRES_PASSWORD: study_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://study_platform:study_platform@localhost:5432/study_platform_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Ruff lint & format
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy typecheck
        run: mypy .

      - name: Architectural import boundaries
        run: lint-imports

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --file /tmp/schema.yml

      - name: Run pytest with coverage
        run: pytest --cov

      - name: Audit Python dependencies
        run: pip-audit -r requirements/base.txt

  frontend:
    name: Frontend (Lint, Types, Tests, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Vitest unit tests
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
